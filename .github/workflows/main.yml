name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repo files
        run: |
          echo "===== ROOT ====="
          ls -la
          echo "===== TREE ====="
          find . -maxdepth 3 -type f | head -80

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          ANDROID_ROOT=$HOME/android-sdk
          mkdir -p "$ANDROID_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$ANDROID_ROOT/cmdline-tools"
          mv "$ANDROID_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_ROOT" --licenses || true
          "$ANDROID_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_ROOT" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Build Debug APK
        run: |
          set -e
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          if [ -f settings.gradle.kts ] && [ -d app ]; then
            echo "Project is at repo root"
            ROOT="."
          elif [ -f AngelVPN-Android/settings.gradle.kts ]; then
            echo "Project is inside AngelVPN-Android/"
            ROOT="AngelVPN-Android"
            echo "sdk.dir=$ANDROID_HOME" > "$ROOT/local.properties"
          else
            echo "ERROR: Android project files not found"
            ls -la
            exit 1
          fi

          cd "$ROOT"
          gradle assembleDebug --no-daemon --stacktrace --info 2>&1 | tee /tmp/build.txt
          echo "===== LAST 80 LINES ====="
          tail -80 /tmp/build.txt

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AngelVPN-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            AngelVPN-Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
